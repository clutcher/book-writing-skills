version: 1

book:
  title: A Fixture Book
  subtitle: Moved Twice
  author: Sam Example
  publication_date: 2025
  toc: false  # the manuscript carries its own contents page
  cover_front: cover/final/front.png
  ebook_cover: cover/final/ebook.png

terms:
  families:
    - {term: tidal, role: primary, also: [tidally]}
    - {term: still, role: antonym}
  compounds: [tidal reach, still reach]
  watch_words:
    word_sense:
      name: one meaning
      reason: >-
        A folded reason that runs
        over two lines.
      words:
        - [duty, duties]

# The author's own files
author:
  stance: author/stance.md
  positioning: author/positioning.md  # who the book is for

reasons: reasons

vocabulary:
  glossary: vocabulary/glossary.md
  heading_separator: " -- "

sources:
  backup: ~/fixture-sources-backup
  files: sources/files  # the copies, kept out of git

marketing:
  amazon: marketing/amazon.html

work:
  dir: .book
  inbox: .book/inbox

writing:
  term_phases: "1-2:learning"
