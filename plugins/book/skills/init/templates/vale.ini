StylesPath = .
MinAlertLevel = suggestion

Vocab = Book

Packages = write-good, proselint, alex

[*.md]
BasedOnStyles = Vale, write-good, proselint, alex, PlainBook

TokenIgnores = (\[[A-Z][A-Za-z]+\+?\d\d\d?\d?[a-z]?\]), (`[^`]+`)

BlockIgnores = (?s)```[a-zA-Z]*\n.*?\n```

# Switch off an upstream rule only with a reason written on the line above it, for example:
# write-good.E-Prime = NO

# The bibliography holds surnames and titles, which are source data, not the book's prose.
[{{references_file}}]
BasedOnStyles =
Vale.Spelling = NO
Vale.Repetition = NO
